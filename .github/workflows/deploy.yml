name: Deploy site

# The site's content comes from two sources, so it rebuilds whenever either can change:
#   the resume PDF (assets/resume.pdf), on every push to main;
#   GitHub repositories tagged "portfolio" (descriptions, releases, READMEs), every hour.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the PDF reader
        run: pip install pypdf==5.9.0
      - name: Read the resume
        run: python scripts/parse_resume.py assets/resume.pdf data/resume.json
      - name: Merge the resume with GitHub repositories tagged "portfolio"
        run: node scripts/build-site.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Tests
        run: npm test
      - name: Build the assistant's knowledge
        run: node scripts/build-knowledge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the content into the HTML for search engines
        run: node scripts/prerender.mjs --bust
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
