name: Deploy worker

# Deploys the Cloudflare Worker (the assistant's LLM proxy) whenever its code changes.
# Credentials live in GitHub's encrypted secrets, never in the repo or on a laptop:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, LLM_API_KEY
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "assets/js/retrieval.js"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: npm test
      - name: Explain missing setup
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::Worker not deployed. Add CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, and LLM_API_KEY under Settings → Secrets and variables → Actions."
      - name: Deploy to Cloudflare
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            LLM_API_KEY
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
